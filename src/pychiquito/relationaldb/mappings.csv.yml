prefixes:
  ex: http://example.com/
  xsd: http://www.w3.org/2001/XMLSchema#
  rml: http://semweb.mmlab.be/ns/rml#
  rr: http://www.w3.org/ns/r2rml#

mappings:
  lineitem:
    sources:
      - [ ./relationaldb/lineitem.tbl~csv]
    s: ex:LineItem_$(l_orderkey)_$(l_linenumber)
    po:
      - [ a, ex:LineItem ]
      - [ ex:order, ex:Order_$(l_orderkey), rr:IRI ]
      - [ ex:part, ex:Part_$(l_partkey), rr:IRI ]
      - [ ex:supplier, ex:Supplier_$(l_suppkey), rr:IRI ]
      - [ ex:lineNumber, $(l_linenumber), xsd:integer ]
      - [ ex:quantity, $(l_quantity), xsd:decimal ]
      - [ ex:extendedPrice, $(l_extendedprice), xsd:decimal ]
      - [ ex:discount, $(l_discount), xsd:decimal ]
      - [ ex:tax, $(l_tax), xsd:decimal ]
      - [ ex:returnFlag, $(l_returnflag), xsd:string ]
      - [ ex:lineStatus, $(l_linestatus), xsd:string ]
      - [ ex:shipDate, $(l_shipdate), xsd:date ]
      - [ ex:commitDate, $(l_commitdate), xsd:date ]
      - [ ex:receiptDate, $(l_receiptdate), xsd:date ]
      - [ ex:shipInstruct, $(l_shipinstruct), xsd:string ]
      - [ ex:shipMode, $(l_shipmode), xsd:string ]
      - [ ex:comment, $(l_comment), xsd:string ]